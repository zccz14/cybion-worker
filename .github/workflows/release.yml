name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            artifact: cybion-worker-macos-aarch64
            cross: false
          - runner: macos-14
            target: x86_64-apple-darwin
            artifact: cybion-worker-macos-x86_64
            cross: false
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cybion-worker-linux-x86_64
            cross: true
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: cybion-worker-linux-aarch64
            cross: true
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cybion-worker-windows-x86_64
            cross: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross
      - run: cross build --release --locked --target ${{ matrix.target }}
        if: matrix.cross
      - run: cargo build --release --locked --target ${{ matrix.target }}
        if: ${{ !matrix.cross }}
      - shell: bash
        run: |
          binary=cybion-worker
          if [[ "${{ matrix.target }}" == *windows* ]]; then binary=cybion-worker.exe; fi
          mkdir -p dist/${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/$binary dist/${{ matrix.artifact }}/
          cp README.md dist/${{ matrix.artifact }}/
          # COMPATIBILITY: maintainers retain Windows tar.gz for pre-0.1.4
          # installers. Remove when their supported minimum moves to 0.1.4.
          tar -C dist -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip ${{ matrix.artifact }}.zip ./dist/${{ matrix.artifact }}
            sha256sum ${{ matrix.artifact }}.zip > ${{ matrix.artifact }}.zip.sha256
          fi
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
          else
            sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
