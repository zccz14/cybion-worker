[package]
name = "cybion-worker"
version = "0.1.4"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "SQLite-free Cybion Worker for Bash, Browser Control, and Computer Use"

[[bin]]
name = "cybion-worker"
path = "src/main.rs"

[dependencies]
fs2 = "0.4"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
anyhow = "1"
futures-util = "0.3"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["net", "sync"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
