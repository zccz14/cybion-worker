[package]
name = "cybion-worker"
version = "0.3.2"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "SQLite-free Cybion Worker for Bash, Browser Control, and Computer Use"

[[bin]]
name = "cybion-worker"
path = "src/main.rs"

[dependencies]
self-replace = "1.5"
flate2 = "1"
tar = "0.4"
fs2 = "0.4"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
anyhow = "1"
futures-util = "0.3"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop", "creation-flags"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[target.'cfg(windows)'.dependencies]
# Only for PROCESS_CREATION_FLAGS: process-wrap's JobObject wrapper re-applies
# creation flags from its own CreationFlags wrapper, so the flag type must be
# the same crate instance process-wrap uses.
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["net", "sync"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
